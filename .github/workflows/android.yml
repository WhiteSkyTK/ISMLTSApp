name: Android - build, test and lint

# Every push and pull request: unit tests, Android Lint and a debug APK you can download from the run
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle's daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew runnable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Build the debug APK
        run: ./gradlew assembleDebug

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ismlts-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Keep the test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
